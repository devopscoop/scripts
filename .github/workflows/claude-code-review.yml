name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    # This workflow fires automatically on every PR, so it is scoped as tightly
    # as it can be while still functioning. pull-requests:write is required to
    # post comments; contents stays read, so this job can comment on a PR but
    # cannot modify code or merge. Note id-token:write is also a write scope:
    # it can mint an OIDC token, so any cloud role that trusts this
    # repository's OIDC subject is reachable from this job.
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # The code-review plugin is deliberately NOT used here. It reports via
          # the ReportFindings tool, and claude-code-action has no handling for
          # ReportFindings at all: it only publishes comments that arrive via
          # mcp__github_inline_comment__create_inline_comment or gh pr comment.
          # With the plugin the job reviews the code and reports into a tool
          # nothing is listening to, costing ~$1 per PR and posting nothing.
          # Dropping it also removes the unpinnable marketplace clone.
          prompt: |
            Review this pull request.

            Focus on correctness bugs, security implications, and anything that
            would break at runtime. Skip pure style and naming preferences.

            The PR branch is already checked out in the working directory.

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for issues tied to specific lines.
            Use `gh pr comment` for a short top-level summary.
            Only post GitHub comments - do not return review text as a message,
            it will not reach anyone.
            If you find nothing worth raising, post a brief top-level comment
            saying so, so the run is distinguishable from a silent failure.

          # The allowlist is REQUIRED, not optional. Passing a prompt puts the
          # action in agent mode, where allowed tools come only from claude_args
          # (tag mode, used by claude.yml, builds its own list instead). The
          # inline comment MCP server is registered only when the allowlist
          # contains an mcp__github_inline_comment__ entry, so without this the
          # job reviews the code, finds no way to report, and posts nothing.
          # Scoped to read and comment: gh pr merge and gh pr create are
          # deliberately absent.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/solutions.md
          claude_args: >-
            --model claude-opus-5
            --effort xhigh
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
